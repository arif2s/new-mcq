[pytest]
pythonpath = .
testpaths = tests/unit
norecursedirs = tests/e2e tests/integration .venv venv data storage ui docs
python_files = test_*.py
addopts =
    -q
    --maxfail=1
    --ignore=tests/e2e
    --ignore=tests/integration
    --ignore=tests/unit/test_alias_search.py
    --ignore=tests/unit/test_docling_parser.py
    --ignore=tests/unit/test_tema_q.py
    --ignore=tests/unit/test_tema_q2.py
